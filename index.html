<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPre - Secure P2P Calls</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col items-center justify-between p-4 bg-[#0a0a0c] selection:bg-yellow-400 selection:text-black">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-zinc-800">
        <div class="flex items-center space-x-2">
            <div class="bg-yellow-400 text-black p-2 rounded-xl font-black text-xl shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider text-yellow-400">ChatPre</h1>
        </div>
        <div class="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Canlı Bağlantı</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center py-6 space-y-6">
        
        <!-- Kimlik Kartı -->
        <div class="w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
            <p class="text-xs font-semibold text-zinc-400 uppercase tracking-widest mb-1">Senin Anonim PreID'n</p>
            <div class="flex items-center justify-between bg-black/50 border border-zinc-800 rounded-2xl p-4">
                <span id="my-peer-id" class="font-mono text-base font-bold text-yellow-400 truncate">Bağlanıyor...</span>
                <button onclick="copyPreID()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-regular fa-copy"></i> Kopyala
                </button>
            </div>
        </div>

        <!-- Arama Paneli -->
        <div class="w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-4">
            <h2 class="text-sm font-bold text-zinc-300 flex items-center gap-2">
                <i class="fa-solid fa-phone-volume text-yellow-400"></i> Arkadaşını Ara
            </h2>
            <div class="flex gap-2">
                <input type="text" id="target-id-input" placeholder="PreID Girin (Örn: cp-9x...)" class="flex-1 bg-black/50 border border-zinc-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 text-white font-mono">
                <button onclick="callUser()" class="bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold px-5 rounded-2xl transition shadow-lg">
                    <i class="fa-solid fa-video"></i>
                </button>
            </div>
        </div>

        <!-- Video Alanı -->
        <div id="video-container" class="w-full hidden flex-col space-y-4">
            <div class="relative w-full aspect-[3/4] bg-black rounded-3xl border border-zinc-800 overflow-hidden shadow-2xl">
                <!-- Karşı Taraf -->
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <!-- Kendi Kameramız -->
                <div class="absolute bottom-4 right-4 w-28 aspect-[3/4] bg-zinc-900 rounded-2xl border border-zinc-700 overflow-hidden shadow-lg">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                </div>
            </div>
            <button onclick="endCall()" class="w-full bg-red-600 hover:bg-red-500 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-phone-slash"></i> Aramayı Sonlandır
            </button>
        </div>

    </main>

    <!-- Gelen Arama Modalı -->
    <div id="incoming-call-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-center space-y-6 shadow-2xl">
            <div class="w-20 h-20 bg-yellow-400/10 border border-yellow-400/30 rounded-full flex items-center justify-center mx-auto text-yellow-400 text-3xl animate-bounce">
                <i class="fa-solid fa-video"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">Gelen Arama Var!</h3>
                <p id="caller-id-text" class="text-xs font-mono text-zinc-400 mt-1">Biri seni arıyor...</p>
            </div>
            <div class="flex gap-3">
                <button onclick="rejectCall()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 rounded-2xl transition">Reddet</button>
                <button onclick="acceptCall()" class="flex-1 bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3 rounded-2xl transition shadow-lg">Kabul Et</button>
            </div>
        </div>
    </div>

    <!-- Script Altyapısı -->
    <script>
        let peer;
        let localStream;
        let currentCall;
        let incomingCallData;

        function generatePreID() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = 'cp-';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        const myPreID = generatePreID();

        function initPeer() {
            peer = new Peer(myPreID, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
            });

            peer.on('call', (call) => {
                incomingCallData = call;
                document.getElementById('caller-id-text').innerText = `Arayan: ${call.peer}`;
                document.getElementById('incoming-call-modal').classList.remove('hidden');
                document.getElementById('incoming-call-modal').classList.add('flex');
            });
        }

        async function getLocalStream() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;
                } catch (err) {
                    alert("Kamera ve mikrofon izni vermen gerekiyor!");
                }
            }
            return localStream;
        }

        async function callUser() {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) return alert("PreID girmelisin!");
            
            const stream = await getLocalStream();
            if (!stream) return;

            const call = peer.call(targetId, stream);
            setupCallEvents(call);
        }

        async function acceptCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.remove('flex');

            const stream = await getLocalStream();
            if (!stream) return;

            incomingCallData.answer(stream);
            setupCallEvents(incomingCallData);
        }

        function rejectCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.remove('flex');
            if (incomingCallData) incomingCallData.close();
        }

        function setupCallEvents(call) {
            currentCall = call;
            document.getElementById('video-container').classList.remove('hidden');
            document.getElementById('video-container').classList.add('flex');

            call.on('stream', (remoteStream) => {
                const remoteVid = document.getElementById('remote-video');
                remoteVid.srcObject = remoteStream;
                remoteVid.play().catch(e => console.log(e));
            });

            call.on('close', () => {
                endCall();
            });
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('video-container').classList.add('hidden');
            document.getElementById('video-container').classList.remove('flex');
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
        }

        function copyPreID() {
            navigator.clipboard.writeText(document.getElementById('my-peer-id').innerText);
            alert("PreID kopyalandı!");
        }

        window.onload = initPeer;
    </script>
</body>
</html>
