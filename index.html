<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPre - Secure Anonymous P2P Calls</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0a0a0c; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-yellow-400 selection:text-black">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-zinc-800">
        <div class="flex items-center space-x-2">
            <div class="bg-yellow-400 text-black p-2 rounded-xl font-black text-xl shadow-lg shadow-yellow-400/20">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-yellow-400 to-amber-500 bg-clip-text text-transparent">ChatPre</h1>
        </div>
        <div class="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="connection-status">Bağlanıyor...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center py-6 space-y-6">
        
        <!-- Kimlik Kartı -->
        <div class="w-full bg-zinc-900/80 border border-zinc-800/80 rounded-3xl p-6 backdrop-blur-xl shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-400/5 rounded-full blur-2xl pointer-events-none"></div>
            
            <p class="text-xs font-semibold text-zinc-400 uppercase tracking-widest mb-1">Anonim Kimliğin (PreID)</p>
            <div class="flex items-center justify-between bg-black/40 border border-zinc-800 rounded-2xl p-4">
                <span id="my-peer-id" class="font-mono text-lg font-bold text-yellow-400 truncate">Bekleniyor...</span>
                <button onclick="copyPreID()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-zinc-300 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-regular fa-copy"></i> Kopyala
                </button>
            </div>
        </div>

        <!-- Arama Yapma Paneli -->
        <div class="w-full bg-zinc-900/80 border border-zinc-800/80 rounded-3xl p-6 backdrop-blur-xl shadow-2xl space-y-4">
            <h2 class="text-sm font-bold text-zinc-300 flex items-center gap-2">
                <i class="fa-solid fa-phone-volume text-yellow-400"></i> Arkadaşını Ara
            </h2>
            <div class="flex gap-2">
                <input type="text" id="target-id-input" placeholder="PreID Girin (Örn: cp-9x...)" class="flex-1 bg-black/40 border border-zinc-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-zinc-600 font-mono">
                <button onclick="callUser()" class="bg-yellow-400 hover:bg-yellow-300 active:scale-95 text-black font-extrabold px-5 rounded-2xl transition shadow-lg shadow-yellow-400/20 flex items-center justify-center">
                    <i class="fa-solid fa-video"></i>
                </button>
            </div>
        </div>

        <!-- Video Alanı (Görüşme Anı) -->
        <div id="video-container" class="w-full hidden flex-col space-y-4">
            <div class="relative w-full aspect-[3/4] bg-black rounded-3xl border border-zinc-800 overflow-hidden shadow-2xl">
                <!-- Karşı Tarafın Videosu ve Sesi -->
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <!-- Kendi Kameramız (Küçük Ekran) -->
                <div class="absolute bottom-4 right-4 w-28 aspect-[3/4] bg-zinc-900 rounded-2xl border border-zinc-700 overflow-hidden shadow-lg">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                </div>
            </div>
            <!-- Aramayı Kapat Butonu -->
            <button onclick="endCall()" class="w-full bg-red-600 hover:bg-red-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg shadow-red-600/30 flex items-center justify-center gap-2">
                <i class="fa-solid fa-phone-slash"></i> Aramayı Sonlandır
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 border-t border-zinc-800/60 text-xs text-zinc-500 flex justify-between items-center">
        <span>ChatPre v1.0.0</span>
        <span class="text-zinc-400 font-medium"><i class="fa-solid fa-lock text-emerald-500"></i> Uçtan Uca P2P Şifreli</span>
    </footer>

    <!-- Gelen Arama Modalı -->
    <div id="incoming-call-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-center space-y-6 shadow-2xl">
            <div class="w-20 h-20 bg-yellow-400/10 border border-yellow-400/30 rounded-full flex items-center justify-center mx-auto text-yellow-400 text-3xl animate-bounce">
                <i class="fa-solid fa-video"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">Gelen Arama Var!</h3>
                <p id="caller-id-text" class="text-xs font-mono text-zinc-400 mt-1">Anonim Kullanıcı arıyor...</p>
            </div>
            <div class="flex gap-3">
                <button onclick="rejectCall()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 rounded-2xl transition">Reddet</button>
                <button onclick="acceptCall()" class="flex-1 bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3 rounded-2xl transition shadow-lg shadow-yellow-400/20">Kabul Et</button>
            </div>
        </div>
    </div>

    <!-- Script Altyapısı -->
    <script>
        let peer;
        let localStream;
        let currentCall;
        let incomingCallData;

        function generatePreID() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = 'cp-';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        const myPreID = generatePreID();

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function showNotification(callerId) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("ChatPre - Gelen Arama!", {
                    body: `${callerId} sizi görüntülü arıyor!`,
                    icon: "https://raw.githubusercontent.com/hersey9/ChatPre/main/icon.png",
                    requireInteraction: true
                });
            }
        }

        async function initLocalCameraFirst() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                alert("Kamera ve mikrofon iznine mutlaka izin vermelisin!");
            }
        }

        async function initPeer() {
            requestNotificationPermission();
            await initLocalCameraFirst();

            document.getElementById('my-peer-id').innerText = myPreID;

            // Güçlendirilmiş TURN ve STUN Konfigürasyonu (Mobil ve Ev Ağı Engellerini Aşmak İçin)
            peer = new Peer(myPreID, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:openrelay.metered.ca:80' },
                        {
                            urls: 'turn:openrelay.metered.ca:80',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        },
                        {
                            urls: 'turn:openrelay.metered.ca:443',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('connection-status').innerText = "Sistem Aktif";
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            });

            peer.on('call', (call) => {
                incomingCallData = call;
                document.getElementById('caller-id-text').innerText = `Arayan: ${call.peer}`;
                document.getElementById('incoming-call-modal').classList.remove('hidden');
                document.getElementById('incoming-call-modal').classList.add('flex');
                showNotification(call.peer);
            });

            peer.on('error', (err) => {
                console.error("PeerJS Hatası:", err);
                document.getElementById('connection-status').innerText = "Bağlantı Hatası!";
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-red-500";
            });
        }

        async function callUser() {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) return alert("Lütfen geçerli bir PreID girin!");
            if (targetId === myPreID) return alert("Kendini arayamazsın kral!");

            if (!localStream) {
                await initLocalCameraFirst();
            }
            if (!localStream) return;

            const call = peer.call(targetId, localStream);
            setupCallEvents(call);
        }

        async function acceptCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.remove('flex');

            if (!localStream) {
                await initLocalCameraFirst();
            }
            if (!localStream) return;

            incomingCallData.answer(localStream);
            setupCallDetails(incomingCallData);
        }

        function rejectCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.remove('flex');
            if (incomingCallData) incomingCallData.close();
        }

        function setupCallEvents(call) {
            currentCall = call;
            document.getElementById('video-container').classList.remove('hidden');
            document.getElementById('video-container').classList.add('flex');

            call.on('stream', (remoteStream) => {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = remoteStream;
                remoteVideo.play().catch(e => console.log("Medya Oynatma Hatası:", e));
            });

            call.on('close', () => {
                endCall();
            });
        }

        function setupCallDetails(call) {
            setupCallEvents(call);
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('video-container').classList.add('hidden');
            document.getElementById('video-container').classList.remove('flex');
            document.getElementById('remote-video').srcObject = null;
        }

        function copyPreID() {
            const idText = document.getElementById('my-peer-id').innerText;
            navigator.clipboard.writeText(idText);
            alert("PreID kopyalandı: " + idText);
        }

        window.onload = initPeer;
    </script>
</body>
</html>
